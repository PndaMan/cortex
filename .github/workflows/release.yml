name: Release

# Build signed-less release binaries for macOS, Windows, and Linux whenever a
# version tag is pushed (e.g. `git tag v1.0.0 && git push --tags`), and attach
# them to a GitHub Release. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS builds (so bundled sidecars match a concrete triple).
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            sidecar-target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
            sidecar-target: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            sidecar-target: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
            sidecar-target: ""

    runs-on: ${{ matrix.platform }}
    # Signing secrets live in the "Production" environment.
    environment: Production
    # Signing secrets surfaced as env so steps can gate on their presence
    # (the `secrets` context isn't allowed in `if:`). All optional — when unset,
    # the build is simply unsigned and everything still works.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # ── macOS code signing + notarization (only when the cert secret is set) ──
      # Best-effort: a bad cert/password logs a warning and the build continues
      # UNSIGNED rather than failing the whole release.
      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        continue-on-error: true
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported signing identity: $CERT_ID"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells scripts/fetch-sidecars.mjs (run via beforeBuildCommand) which
          # triple to fetch binaries for; empty → the runner's host triple.
          SIDECAR_TARGET: ${{ matrix.sidecar-target }}
          # macOS signing + notarization. The cert is imported into the keychain
          # by the step above (which sets APPLE_SIGNING_IDENTITY only on success),
          # so we DON'T pass APPLE_CERTIFICATE here — that keeps a bad-password
          # cert from failing the build; signing simply no-ops when the identity
          # is empty.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-updater artifact signing (minisign). When set, tauri-action also
          # generates + uploads latest.json for the updater endpoint.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: "Cortex ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "See the assets below to download and install Cortex for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
