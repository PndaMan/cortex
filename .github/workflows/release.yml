name: Release

# Build signed-less release binaries for macOS, Windows, and Linux whenever a
# version tag is pushed (e.g. `git tag v1.0.0 && git push --tags`), and attach
# them to a GitHub Release. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS builds (so bundled sidecars match a concrete triple).
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            sidecar-target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
            sidecar-target: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            sidecar-target: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
            sidecar-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells scripts/fetch-sidecars.mjs (run via beforeBuildCommand) which
          # triple to fetch binaries for; empty → the runner's host triple.
          SIDECAR_TARGET: ${{ matrix.sidecar-target }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: "Cortex ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "See the assets below to download and install Cortex for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
