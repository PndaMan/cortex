# Local-only override: binds the proxy to 127.0.0.1 so nothing is exposed on the
# LAN. Use for trying the stack on a workstation before moving it to a homelab
# host:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Cortex's Homelab URL is then http://127.0.0.1:8080.
services:
  proxy:
    ports: !override
      - "127.0.0.1:8080:8080"
