# SearXNG settings for Cortex.
# The one non-default that matters: JSON output MUST be enabled or Cortex's
# requests get a 403 (SearXNG ships with JSON off by default).
#
# IMPORTANT: change server.secret_key before exposing this beyond localhost.
# Generate one with:  openssl rand -hex 32

use_default_settings: true

server:
  # CHANGE ME — any long random string.
  secret_key: "change-me-openssl-rand-hex-32"
  limiter: false
  image_proxy: true

search:
  # Cortex talks to SearXNG over JSON; both formats stay enabled so the web UI
  # still works if you open it in a browser.
  formats:
    - html
    - json

ui:
  static_use_hash: true
