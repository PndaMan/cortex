[package]
name = "cortex"
version = "1.0.23"
description = "Cortex — desktop study OS"
authors = ["Aidan McConnon"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cortex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# sqlite-vec: statically-linked vector search extension (registered via
# sqlite3_auto_extension at startup — no runtime .so to load).
sqlite-vec = "0.1.6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "multipart"] }
# Read Anki `.apkg` archives on import (an apkg is a ZIP holding a SQLite
# collection). Pure-Rust deflate only — no system zlib, no extra C deps. The
# export path hand-rolls a STORED zip writer; reading needs real unzip, hence
# this crate (default features off keeps bzip2/zstd/AES out of the build).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pure-Rust PDF text extraction — the on-device fallback when poppler's `pdftotext`
# CLI isn't present (iOS/Android, or a desktop without poppler). Handles text-layer
# PDFs entirely in-process; scanned PDFs still need OCR (homelab ingest service).
pdf-extract = "0.10"

# Desktop-only deps. The system tray, single-instance guard and auto-updater don't
# exist on iOS/Android, so they're gated to desktop targets and the mobile build
# links without them. NB: a Cargo target table can't use tauri's `desktop` cfg
# (that's emitted by tauri-build for CODE, not known to Cargo at resolve time), so
# we enumerate the desktop OSes here; the matching code is gated `#[cfg(desktop)]`.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_8"] }
# Used to intercept Ctrl+F at the GTK level (WebKitGTK's native find steals
# Ctrl+C/V). Versions match webkit2gtk 2.0's gtk-rs (0.18).
gtk = "0.18"
gdk = "0.18"

[features]
# this feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# panic stays "unwind": a panicking command thread shouldn't kill the whole app.
lto = "thin"
codegen-units = 1
strip = true
