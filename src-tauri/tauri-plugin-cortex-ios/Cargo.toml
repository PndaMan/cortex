[package]
name = "tauri-plugin-cortex-ios"
version = "0.1.0"
description = "Native iOS bridge for Cortex: background lecture recorder, Live Activity and widget snapshots"
edition = "2021"
rust-version = "1.77"
# Required by the tauri-plugin build helper (must equal package.name).
links = "tauri-plugin-cortex-ios"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
